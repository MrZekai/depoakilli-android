#
# Gradle Daemon JVM criteria (Gradle 8.8+).
#
# Root cause this file fixes:
#   Gradle 8.13 embeds Kotlin 2.0.21. The IntelliJ `JavaVersion.parse()` shipped
#   inside kotlin-compiler-embeddable 2.0.21 only accepts Java feature versions
#   up to 24. When the Gradle daemon runs on JDK 25+, compiling the very first
#   Kotlin DSL script (settings.gradle.kts) fails with:
#       java.lang.IllegalArgumentException: 25.0.4
#           at ...intellij.util.lang.JavaVersion.parse(JavaVersion.java:307)
#           at ...JavaVersionUtilsKt.isAtLeastJava9(javaVersionUtils.kt:11)
#
# Smart Cleaner targets Java 17 (AGP 8.13.2 / Kotlin 2.2.21 / JVM target 17),
# so the daemon is pinned to a Java 17 toolchain here. The launcher JVM no
# longer decides the outcome, which makes a clean Windows Git Bash clone and
# GitHub Actions behave identically.
#
# Requirement: a Java 17 JDK must be installed and discoverable (JAVA_HOME,
# SDKMAN!, Android Studio's bundled JBR 17, /usr/lib/jvm, Program Files, ...).
# See docs/BUILD_ENVIRONMENT_JDK17.md and scripts/bootstrap-local-env.sh.
#
toolchainVersion=17
