name: Similar photos device check and shots
# Faz 3B-1: on an emulator with a generated photo set (never stored in the
# repo): grouping check, screenshots in every app language, Trash move,
# speed run. Pushes the PNGs to `similar-speed-raw` (no app code, no keys).
on:
  push:
    branches: [similar-shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleDebug "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"
          ls -l app/build/outputs/apk/debug/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make the photo set
        run: |
          pip install -q pillow
          python3 scripts/store-shots/gen_similar_set.py photo-set 3000
          du -sh photo-set photo-set-fill
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            SPEED_ONLY=1 python3 scripts/store-shots/capture_similar.py photo-set photo-set-fill similar-out || true
      - name: Push screenshots
        if: always()
        run: |
          set -e
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r similar-out/. /tmp/pub/ || true
          cd /tmp/pub
          git init -q -b similar-speed-raw
          git config user.name "store-shots-bot"; git config user.email "store-shots-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Similar photos screenshots ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" similar-speed-raw
