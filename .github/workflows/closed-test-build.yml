name: Play Closed Test AAB + APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-closed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash ./scripts/validate-release-env.sh

      - name: Decode Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depoakilli-upload.jks"

      - name: Verify project invariants
        run: python3 scripts/validate-project.py

      - name: Verify closed-test dependency metadata
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:checkClosedTestAarMetadata

      - name: Run unit tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Run closed-test lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: ./gradlew --stacktrace lintClosedTest

      - name: Build signed closed-test AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: ./gradlew --stacktrace bundleClosedTest assembleClosedTest

      - name: Verify closed-test AAB and APK
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash scripts/verify-closed-test-binaries.sh

      - name: Prepare separated upload and diagnostics artifacts
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        shell: bash
        run: |
          rm -rf closed-test-artifacts
          mkdir -p closed-test-artifacts/aab closed-test-artifacts/apk closed-test-artifacts/diagnostics/legal
          cp app/build/outputs/bundle/closedTest/app-closedTest.aab closed-test-artifacts/aab/SmartCleaner-ClosedTest-v39.aab
          cp app/build/outputs/apk/closedTest/app-closedTest.apk closed-test-artifacts/apk/SmartCleaner-ClosedTest-v39.apk
          cp app/build/outputs/mapping/closedTest/mapping.txt closed-test-artifacts/diagnostics/mapping.txt
          cp -R app/build/reports/closed-test-binary-audit/. closed-test-artifacts/diagnostics/binary-audit/
          find app/build/reports -maxdepth 1 -type f -name 'lint-results-*' -exec cp {} closed-test-artifacts/diagnostics/ \;
          escaped="$SUPPORT_EMAIL"
          escaped="${escaped//\\/\\\\}"
          escaped="${escaped//&/\\&}"
          escaped="${escaped//|/\\|}"
          for document in PRIVACY_POLICY_EN.md PRIVACY_POLICY_TR.md TERMS_OF_SERVICE_EN.md TERMS_OF_SERVICE_TR.md; do
            sed "s|{{SUPPORT_EMAIL}}|$escaped|g" "$document" > "closed-test-artifacts/diagnostics/legal/$document"
          done

      - name: Upload Play closed-test AAB
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-PLAY-CLOSED-TEST-AAB-v39
          path: closed-test-artifacts/aab/SmartCleaner-ClosedTest-v39.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload closed-test install APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-CLOSED-TEST-APK-v39
          path: closed-test-artifacts/apk/SmartCleaner-ClosedTest-v39.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload closed-test diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-ClosedTest-Diagnostics-v39
          path: closed-test-artifacts/diagnostics/
          if-no-files-found: error
          retention-days: 30
