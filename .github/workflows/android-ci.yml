name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify project invariants
        run: python3 scripts/validate-project.py

      - name: Verify Android dependency metadata
        run: ./gradlew --stacktrace :app:checkDebugAarMetadata

      - name: Verify resolved Fragment runtime version
        run: ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.fragment:fragment

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Run Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --stacktrace lintDebug

      - name: Print full lint report
        if: always()
        shell: bash
        run: |
          report="app/build/reports/lint-results-debug.txt"
          if [[ -f "$report" ]]; then
            echo "===== FULL LINT REPORT ====="
            cat "$report"
            echo "===== END LINT REPORT ====="
          else
            echo "Expected lint text report was not found at: $report"
            echo "Searching for other lint text reports:"
            find app/build -type f -name "lint-results-*.txt" -print -exec cat {} \; 2>/dev/null || true
          fi

      - name: Build debug APK
        id: assemble
        if: always()
        continue-on-error: true
        run: ./gradlew --stacktrace assembleDebug

      - name: Verify stable test signing certificate
        id: signing
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: bash scripts/verify-qa-signing.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depoakilli-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depoakilli-tests-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depoakilli-lint-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce lint and APK build results
        if: always()
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
        run: |
          failed=0
          if [[ "$LINT_OUTCOME" != "success" ]]; then
            echo "Android lint outcome: $LINT_OUTCOME"
            failed=1
          fi
          if [[ "$ASSEMBLE_OUTCOME" != "success" ]]; then
            echo "Debug APK build outcome: $ASSEMBLE_OUTCOME"
            failed=1
          fi
          if [[ "$SIGNING_OUTCOME" != "success" && "$SIGNING_OUTCOME" != "skipped" ]]; then
            echo "QA signing verification outcome: $SIGNING_OUTCOME"
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "CI failed after collecting lint, APK build and signing results."
            exit 1
          fi
          echo "Android lint, debug APK build and QA signing checks passed."
