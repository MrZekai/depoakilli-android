name: Fetch on-device models
# One-off helper: downloads the MediaPipe image embedder model and the latest
# library versions, and pushes them to the `models-raw` branch (no app code).
on:
  push:
    branches: [models-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set -e
          mkdir out && cd out
          B=https://storage.googleapis.com/mediapipe-models/image_embedder
          curl -fsSL -o mobilenet_v3_small.tflite $B/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
          curl -fsSL -o mobilenet_v3_large.tflite $B/mobilenet_v3_large/float32/latest/mobilenet_v3_large.tflite || true
          for a in com/google/mediapipe/tasks-vision com/google/mlkit/face-detection com/google/mlkit/image-labeling; do
            curl -fsSL https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -oE "<(latest|release)>[^<]+" | sed "s|^|$a |" >> versions.txt || echo "$a ?" >> versions.txt
          done
          curl -fsSL https://dl.google.com/dl/android/maven2/com/google/mediapipe/tasks-vision/maven-metadata.xml -o tasks-vision-meta.xml || true
          M=https://dl.google.com/dl/android/maven2/com/google/mlkit
          for a in image-labeling/17.0.9/image-labeling-17.0.9.aar image-labeling-default-common/17.0.0/image-labeling-default-common-17.0.0.aar image-labeling-common/18.1.0/image-labeling-common-18.1.0.aar face-detection/16.1.7/face-detection-16.1.7.aar; do
            curl -fsSL -o $(basename $a) $M/$a || echo "missing $a"
          done
          curl -fsSL https://dl.google.com/dl/android/maven2/com/google/mlkit/image-labeling/17.0.9/image-labeling-17.0.9.pom -o il.pom || true
          cat il.pom || true
          mkdir -p aar && for f in *.aar; do mkdir -p aar/$f && (cd aar/$f && unzip -q -o ../../$f); done
          find aar -type f | head -100
          find aar -type f \( -name "*.txt" -o -name "*label*" \) -exec sh -c 'echo "== $1"; head -c 300 "$1"; echo' _ {} \;
          strings -n 3 aar/image-labeling-17.0.9.aar/assets/mlkit_label_default_model/mobile_ica_8bit_with_metadata_tflite | tail -600 | tr '\n' '|' | head -c 12000; echo
          for f in aar/*/AndroidManifest.xml; do echo "== $f"; grep -E "uses-permission|<service|<provider" $f; done
          for f in $(find aar -name "*.tflite" -o -name "*.bin"); do ls -l $f; strings -n 4 $f | grep -iE "receipt|document|paper|menu|poster|screenshot|text|meme|cartoon|font|handwriting" | sort -u | head -40; done
          rm -rf aar *.aar
          sha256sum *.tflite > SHA256SUMS
          ls -l; cat versions.txt
      - name: Push
        run: |
          cd out
          git init -q -b models-raw
          git config user.name "models-bot"; git config user.email "models-bot@users.noreply.github.com"
          git add -A && git commit -q -m "models ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" models-raw
