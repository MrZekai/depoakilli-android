name: Icon check
on:
  push:
    branches: [claude/icon-check]
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build QA APK
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleQa "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/icon-check/run.sh || true
      - name: Publish shots
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r icon-shots/. /tmp/pub/ && cd /tmp/pub
          git init -q -b icon-check-shots
          git config user.name "icon-check-bot"
          git config user.email "icon-check-bot@users.noreply.github.com"
          git add -A && git commit -q -m "icon shots ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" icon-check-shots
