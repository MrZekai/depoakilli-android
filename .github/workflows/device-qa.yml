name: Device QA

# Runs the QA APK on an Android emulator and checks the screens the owner
# would otherwise test by hand. Test-only: no app code, no Gradle dependency,
# no release keys (the QA build uses the stable QA test certificate).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build QA APK
        run: ./gradlew --stacktrace assembleQa "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"

      # A second, different app (the debug build) that the scenario fills with
      # 700 MB of data. Built separately: compiling both at once runs out of memory.
      - name: Build debug APK (stand-in big app)
        run: ./gradlew --stacktrace assembleDebug "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"

      # Faz 3A-2: a real >= 100 MB, >= 10 s video for the shrink check. Made
      # here (never stored in the repo): 480p30, 11 s, ~80 Mbps H.264 + AAC,
      # with a capture date.
      - name: Make the shrink test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=854x480:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 11 -vf "noise=alls=30:allf=t" -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -b:v 80M -minrate 80M -maxrate 80M -bufsize 80M -x264-params nal-hrd=cbr \
            -c:a aac -b:a 128k -metadata creation_time=2025-06-01T10:00:00Z -movflags +faststart qa-shrink.mp4
          ls -l qa-shrink.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/qa/app-qa.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/device-qa/run.py

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-Device-QA-${{ github.run_number }}
          path: device-qa-out/
          if-no-files-found: warn
