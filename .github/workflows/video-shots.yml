name: Video shrink screen shots
# Faz 3A-2: Z5–Z8 in every app language from a real shrink on an emulator.
# The test video is made here by ffmpeg (never stored in the repo).
# Pushes the PNGs to the `video-shots-raw` branch (no app code, no keys).
on:
  push:
    branches: [video-shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleDebug "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"
      - name: Make the test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=854x480:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 20 -vf "noise=alls=40:allf=t" -pix_fmt yuv420p \
            -c:v libx264 -preset veryfast -profile:v high -level 4.2 -b:v 45M -maxrate 50M -bufsize 50M \
            -c:a aac -b:a 128k -metadata creation_time=2025-06-01T10:00:00Z -movflags +faststart shots-video.mp4
          ls -l shots-video.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/store-shots/capture_video.py shots-video.mp4 video-shots-out || true
      - name: Push screenshots to video-shots-raw
        if: always()
        run: |
          set -e
          ls -R video-shots-out | head -80 || true
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r video-shots-out/. /tmp/pub/ || true
          cd /tmp/pub
          git init -q -b video-shots-raw
          git config user.name "store-shots-bot"
          git config user.email "store-shots-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Video shrink screenshots ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-shots-raw
