name: Signed Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash ./scripts/validate-release-env.sh

      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depoakilli-upload.jks"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          ADMOB_RESULT_NATIVE_ID: ${{ secrets.ADMOB_RESULT_NATIVE_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace bundleRelease

      - name: Verify actual release bundle and universal APK
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash ./scripts/verify-release-aab.sh

      - name: Upload signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: depoakilli-release-aab-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            release-verification/
          if-no-files-found: error
          retention-days: 30
