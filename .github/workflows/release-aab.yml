name: Play Production AAB + APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Read app version from Gradle
        run: |
          code="$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)"
          name="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)"
          test -n "$code" && test -n "$name"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash ./scripts/validate-release-env.sh

      - name: Decode existing Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depoakilli-upload.jks"

      - name: Verify project invariants
        run: python3 scripts/validate-project.py

      - name: Run unit tests and production lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          chmod +x gradlew
          # CI-only heap, as android-ci.yml full-checks: the 768 MB Kotlin daemon
          # from gradle.properties (sized for 16 GB Windows machines) runs out here.
          ./gradlew --stacktrace testDebugUnitTest "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"
          ./gradlew --stacktrace lintRelease "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"

      - name: Build signed production AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/depoakilli-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: ./gradlew --stacktrace bundleRelease assembleRelease "-Dorg.gradle.jvmargs=-Xmx4g -Xss768k" "-Pkotlin.daemon.jvmargs=-Xmx4g -Xss768k"

      - name: Verify production binaries, no ad SDK and existing upload certificate
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: bash ./scripts/verify-release-aab.sh

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-PLAY-PRODUCTION-AAB-v${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed production APK
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-PRODUCTION-APK-v${{ env.VERSION_CODE }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload production verification and mapping
        uses: actions/upload-artifact@v6
        with:
          name: SmartCleaner-Production-Diagnostics-v${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            release-verification/
          if-no-files-found: error
          retention-days: 30
