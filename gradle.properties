# Keep enough native/OS headroom on 16 GB Windows machines during Android Lint.
# Running Debug and QA analysis together with a 3 GB heap previously exhausted
# the Windows commit limit (39 MB remained) and crashed G1 while mapping 200 MB.
org.gradle.jvmargs=-Xmx2g -Xss768k -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m -Xss768k
android.nonTransitiveRClass=true

# Debug builds use Google's official sample IDs when these values are absent.
# Never commit live AdMob IDs. CI release builds read them from repository secrets.
# ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
# ADMOB_BANNER_ID=ca-app-pub-xxxxxxxxxxxxxxxx/xxxxxxxxxx
# ADMOB_INTERSTITIAL_ID=ca-app-pub-xxxxxxxxxxxxxxxx/xxxxxxxxxx
